[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthseekinggym"
version = "0.1.0"
description = "Research code for truth-seeking AI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
requires-python = ">=3.10"
keywords = ["ai", "reasoning", "evaluation", "truth-seeking", "belief-entrenchment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai",
    "deepseek",
    "tiktoken",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy",
    "dacite",
    "huggingface-hub",
    "scikit-learn",
    "matplotlib>=3.5.0",
    "google",
    "statsmodels",
    "datasets",
    "seaborn>=0.11.0",
    "python-dotenv",
    "websockets==14.2",
    "bitsandbytes>=0.45.3",
    "torch",
    "sglang[all]>=0.4.10",
    "nvitop",
    "pathlib",
    "peft",
    "ray",
    "together",
    "dotenv",
    "aiohttp",
    "aiohttp-sse",
    "trl>=0.21.0",
    "deepspeed",
    "transformers>=4.54.1",
    "wandb>=0.21.3",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "black",
    "mypy",
]

[tool.setuptools]
packages = ["core", "scripts", "utils"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.yaml", "*.yml"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
mypy_path = ["lib/safety_tooling"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "scripts/tests_examples"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
